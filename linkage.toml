# This article's binding to the `linkage` framework.
#
# `slug` is the satellite id: the hub keys claim refs (`num:hcs:…`) and the manifest
# filename (`blueprint-manifest-hcs.json`) on it, so it must stay stable once wiki
# notes start citing this article.

slug = "hcs"

[paths]
blueprint = "blueprint/src/content.tex"
axioms    = "blueprint/AXIOMS.md"
macros    = "blueprint/src/macros.tex"
allowlist = "blueprint/render-allowlist.txt"
lean      = "Formalization"
paper     = "paper"

# The shared core's declarations count as "declared here" for check 1: a result that lives
# in ScaleSpaceCore is still proved, and a blueprint node pointing at it is still correct.
# Enabled 2026-08-09, when the Lean phase started; requires
# Formalization/.lake/packages/ScaleSpaceCore to exist, i.e. `lake build` to have run.
lean_packages = ["ScaleSpaceCore"]

# Everything else is a framework default and is omitted deliberately — the statement
# environments, statement label prefixes, ledger-id shape and pandoc pin all live in
# linkage/config.py. Override here only if this article genuinely differs.
#
# The linkage *macro* names are not configurable at all: they are the framework's
# vocabulary, and the hub reads every satellite's manifest with one reader.

# The release, read by `linkage release export` / `linkage release zenodo` (article-kit
# docs/RELEASE.md, "The commands"). Added 2026-09-27 for v1.1.0, the first release of this
# article through the commands; v1.0.0 was deposited by hand (records/PLAN-publication.md).
#
# This repository is public and holds one module, so there is no separate public export
# repository as for a private multi-module one: the export is a local staging tree that the
# Zenodo commands read and zip, and `repo_url` is this repository.

[release]
creators  = [{ name = "Fagerström, Daniel", orcid = "0009-0001-0165-1978" }]
license   = "cc-by-4.0"
copyright = "2026 Daniel Fagerström"

[[modules]]
name     = "kernels"
chapters = ["02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
paper    = "paper"
tag      = "v1.1.0"
# The tagged statements give the closure its other roots. Witnesses.lean is imported by no
# tagged statement, so without it the export drops the fidelity review's non-vacuity
# witnesses and their 24 guard lines.
roots    = ["Hemigroup.Witnesses"]
headline = "Hemigroup.SelfDecomposableExponent.main_characterization"
stem     = "hemigroup-causal-scale-space-kernels"
title    = "Time-Causal Scale Space from Hemigroup Axioms: Characterization of the Kernels"
repo_url = "https://github.com/danielfagerstrom/hemigroup-causal-scale-space-kernels"
response_plans = ["notes/PLAN-review-response.md"]
reviews  = "notes/reviews"
keywords = ["scale space", "hemigroup", "time-causal", "self-decomposable", "Lean 4"]
