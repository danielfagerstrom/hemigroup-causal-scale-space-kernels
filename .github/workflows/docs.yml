name: Docs CI

# Thin caller — the Tectonic builds, the orphan `artifacts` branch and the Cloudflare Pages
# deploy live in the shared framework. This article owns its trigger (paths filters guard
# private-repo Actions minutes) and its own Pages project.
#
# The paper build runs on blueprint/** too: theorem statements are single-sourced between
# the two, so a blueprint edit must rebuild the paper.
#
# Three views are built and deployed to the Pages project: paper.pdf, blueprint.pdf, and the
# plasTeX web blueprint at /blueprint/ — the only view that renders the \uses dependency
# graph and the [T]/[A] status tags. `build_web` defaults to true; the web job needs neither
# TeX nor graphviz (see the framework workflow's header for why). Locally the same three come
# from `scripts/build-blueprint.sh`.

# Publishing a RELEASE: run this workflow against the release tag
#
#     gh workflow run docs.yml --ref <tag>
#
# The shared workflow reads the channel off the ref -- a tag writes that release, anything
# else writes the development head -- so a release is published by an act, never as a side
# effect of a push. The release channel is write-once; the paper becomes visible when the
# hub's constellation.json names the version in this module's `site.published`.

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "blueprint/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "paper/**"
      - "blueprint/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# `contents: write` because the called workflow's publish job force-pushes the built PDFs
# to the orphan `artifacts` branch. A caller cannot grant LESS than a called workflow
# requests: with `contents: read` here the whole run fails as a startup_failure with only
# "This run likely failed because of a workflow file issue" and no logs.
permissions:
  contents: write

jobs:
  docs:
    uses: danielfagerstrom/article-kit/.github/workflows/docs.yml@main
    with:
      slug: hemigroup-time-causal-kernels
      dry_run: ${{ github.event_name == 'pull_request' }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
