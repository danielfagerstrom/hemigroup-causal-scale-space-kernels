name: Lean CI

# Path-filtered: article-only changes (paper/, draft/, blueprint prose) don't need a
# Lean build. Keep the filter in sync with what the reusable workflow reads: the Lean
# sources, the trust boundary it checks the axiom guard against, and this file itself.
# NOTE: if the lean job is ever made a required status check, path-skipped runs will
# block merging — the filter and required-check settings must be decided together.
on:
  push:
    branches: [main]
    paths:
      - 'Formalization/**'
      - 'blueprint/trust-boundary.txt'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'Formalization/**'
      - 'blueprint/trust-boundary.txt'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

jobs:
  lean:
    uses: danielfagerstrom/article-kit/.github/workflows/lean.yml@main
    with:
      lean_dir: Formalization
      build_args: Hemigroup
      sorry_guard_dir: Formalization/Hemigroup
      axiom_guard_file: CIAxiomGuard.lean
    secrets:
      # needs Contents:read on article-kit AND scale-space-lean (a private Lake dependency)
      ARTICLE_KIT_TOKEN: ${{ secrets.ARTICLE_KIT_TOKEN }}
